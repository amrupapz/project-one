[project]
name = "llm-regression-lab"
version = "0.1.0"
description = "Phase 1: customer support email classifier with versioned prompts"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openai>=1.40",
    "instructor>=1.4",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
